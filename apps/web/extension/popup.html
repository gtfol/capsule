<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Add to Capsule</title>
    <link rel="stylesheet" href="popup.css" />
    <script src="popup.mjs" type="module"></script>
  </head>
  <body>
    <main>
      <h1>Capsule</h1>
      <div class="page" id="page" hidden>
        <p class="domain" id="domain"></p>
        <p class="title" id="title"></p>
      </div>
      <p class="status" id="status" role="status" aria-live="polite">Reading this page…</p>
      <div class="actions" id="actions" aria-busy="false">
        <button type="button" data-destination="wardrobe" disabled>
          <span>Add to wardrobe</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M7 17 17 7M7 7h10v10" /></svg>
        </button>
        <button type="button" data-destination="wishlist" disabled>
          <span>Save to wishlist</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M7 17 17 7M7 7h10v10" /></svg>
        </button>
      </div>
      <p class="note">Review the item in Capsule before saving.</p>
    </main>
  </body>
</html>
